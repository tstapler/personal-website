<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.js"></script>
    <style>
        .pushable > .pusher {
            background: white;
        }
        .ui.sidebar {
            width: 260px;
        }
        .content {
            padding: 20px;
        }
        .toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <div class="ui left vertical menu inverted sidebar labeled icon">
        <div class="item">
            <i class="home icon"></i>
            <a href="/">Home</a>
        </div>
        <div class="item">
            <i class="user icon"></i>
            <a href="/about">About</a>
        </div>
    </div>

    <div class="pushable">
        <div class="pusher">
            <button class="ui toggle-btn button" onclick="$('.ui.sidebar').sidebar('toggle')">
                <i class="bars icon"></i> Toggle Sidebar
            </button>
            <div class="content">
                <h1>Test Page</h1>
                <p>Click the button to toggle the sidebar.</p>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('.ui.sidebar').sidebar({
                context: $('.pushable'),
                exclusive: true,
                dimPage: false,
                transition: 'overlay'
            });
        });
    </script>
</body>
</html>
