name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Build Site
        run: bazel build //:site_optimized

      - name: Prepare Deployment Directory
        run: |
          mkdir -p dist
          tar -xf bazel-bin/site_optimized_dir.tar -C dist

      - name: Index site with Pagefind
        run: npx --yes pagefind@1 --site dist --output-subdir pagefind

      - name: Set deployment branch
        id: set-branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "branch=master" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=personal-website --commit-hash=${{ github.sha }} --branch=${{ steps.set-branch.outputs.branch }}
